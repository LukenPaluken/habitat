name: CI Pipeline

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest

    # The integration tests need a real PostgreSQL (they create their own
    # `habitat_test` database in it and never touch another one).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Check Formatting
        run: bun x prettier --check .

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Run tests
        run: bun test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/habitat_test
